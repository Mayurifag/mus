---
name: Deploy to Container Registries

"on":
  workflow_run:
    workflows: [ "Linters pipeline" ]
    types:
      - completed
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-registries:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Set build metadata
        id: build_meta
        run: |
          commit_sha=$(git rev-parse HEAD)
          {
            echo "commit_sha=$commit_sha"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "commit_title=$(git log -1 --pretty=%s)"
          } >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
            if [ "$commit_sha" != "$main_sha" ]; then
              echo "Skipping outdated successful CI run for $commit_sha"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        if: steps.build_meta.outputs.publish == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        if: steps.build_meta.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        if: steps.build_meta.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        if: steps.build_meta.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase repository name
        if: steps.build_meta.outputs.publish == 'true'
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push to both registries
        if: steps.build_meta.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: docker/production/production.Dockerfile
          push: true
          build-args: |
            COMMIT_TITLE=${{ steps.build_meta.outputs.commit_title }}
            COMMIT_SHA=${{ steps.build_meta.outputs.commit_sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.build_meta.outputs.commit_sha }}
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ steps.build_meta.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger watchtower
        if: steps.build_meta.outputs.publish == 'true'
        uses: Mayurifag/multiple-watchtowers-update-action@6a98d6c7f807abecc82a358bb69978157077fee4 # 1.0.1
        with:
          watchtower-urls: ${{ secrets.WATCHTOWER_URLS }}
          watchtower-tokens: ${{ secrets.WATCHTOWER_TOKENS }}
