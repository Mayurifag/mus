---
name: Deploy to Container Registries

"on":
  workflow_run:
    workflows: [ "Linters pipeline" ]
    types:
      - in_progress
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  deploy-registries:
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      # Don't interrupt a registry push or container restart. The release gate
      # skips queued candidates that are no longer the tip of main.
      cancel-in-progress: false
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set build metadata
        id: build_meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          commit_sha=$(git rev-parse HEAD)
          {
            echo "commit_sha=$commit_sha"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "apk_cache_epoch=$(date -u +'%G-W%V')"
            echo "commit_title=$(git log -1 --pretty=%s)"
          } >> "$GITHUB_OUTPUT"
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$commit_sha" != "$main_sha" ]; then
            echo "Skipping outdated revision $commit_sha"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Explicit deployments bypass the diff, not the release gate.
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A successful no-op run is not a release. Check the completed release
          # steps rather than trusting :latest, which a partial push can update.
          released_sha=
          for ((page = 1; ; page++)); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=completed&per_page=100&page=$page" \
              --jq '.workflow_runs[] | [.id, .run_attempt, .head_sha, .conclusion] | @tsv')
            [ -n "$runs" ] || break
            while read -r run_id attempt sha conclusion; do
              [ "$conclusion" != skipped ] || continue
              jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt/jobs")
              pushed=$(jq -r '[.jobs[].steps[]? | select(.name == "Build and push to both registries") | .conclusion][0] // "skipped"' <<< "$jobs")
              [ "$pushed" != skipped ] || continue
              triggered=$(jq -r 'any(.jobs[].steps[]?; .name == "Trigger watchtower" and .conclusion == "success")' <<< "$jobs")
              # A failed release may have updated one of the registries.
              if [ "$conclusion/$pushed/$triggered" = success/success/true ]; then
                released_sha=$sha
              fi
              break 2
            done <<< "$runs"
          done

          # Match the production Dockerfile and .dockerignore inputs.
          if [ -n "$released_sha" ] && git cat-file -e "$released_sha^{commit}" 2>/dev/null &&
            git diff --quiet "$released_sha" "$commit_sha" -- \
              .dockerignore frontend/ backend/Cargo.toml backend/Cargo.lock backend/src/ \
              docker/production/production.Dockerfile docker/production/production.Dockerfile.dockerignore \
              docker/production/entrypoint.sh docker/yt-dlp.conf \
              ':(exclude,glob)frontend/**/*.md' ':(exclude,glob)frontend/**/*.markdown' \
              ':(exclude,glob)frontend/src/**/*.test.ts' ':(exclude)frontend/vitest-setup-client.ts' \
              ':(exclude)frontend/eslint.config.js' ':(exclude,glob)frontend/.prettier*'; then
            echo "Application image inputs are unchanged since $released_sha"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: steps.build_meta.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build release candidate while CI runs
        if: steps.build_meta.outputs.publish == 'true' && github.event_name == 'workflow_run'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/production/production.Dockerfile
          platforms: linux/amd64
          build-args: &release_build_args |
            COMMIT_TITLE=${{ steps.build_meta.outputs.commit_title }}
            COMMIT_SHA=${{ steps.build_meta.outputs.commit_sha }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            APK_CACHE_EPOCH=${{ steps.build_meta.outputs.apk_cache_epoch }}
          cache-from: type=gha
          outputs: type=cacheonly
      - name: Require passing CI for the current main revision
        id: release_gate
        if: steps.build_meta.outputs.publish == 'true'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          COMMIT_SHA: ${{ steps.build_meta.outputs.commit_sha }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            # A rerun must not satisfy the gate for a different attempt or revision.
            CI_ATTEMPT="repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/attempts/$CI_RUN_ATTEMPT"
            while :; do
              result=$(gh api "$CI_ATTEMPT" --jq '[.status, (.conclusion // "pending"), .head_sha] | @tsv')
              IFS=$'\t' read -r status conclusion tested_sha <<< "$result"
              if [ "$tested_sha" != "$COMMIT_SHA" ]; then
                echo "::error::CI revision does not match release candidate $COMMIT_SHA"
                exit 1
              fi
              [ "$status" != completed ] || break
              sleep 5
            done
            if [ "$conclusion" != success ]; then
              echo "::error::Linters pipeline concluded $conclusion for $COMMIT_SHA"
              exit 1
            fi
          else
            tested=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/linters.yml/runs?head_sha=$COMMIT_SHA&status=success&per_page=1" --jq '.total_count')
            if [ "$tested" = 0 ]; then
              echo "::error::Run the Linters pipeline successfully for $COMMIT_SHA before deploying."
              exit 1
            fi
          fi
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$COMMIT_SHA" != "$main_sha" ]; then
            echo "Skipping outdated revision $COMMIT_SHA"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        if: steps.release_gate.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        if: steps.release_gate.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase repository name
        if: steps.release_gate.outputs.publish == 'true'
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push to both registries
        if: steps.release_gate.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/production/production.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: *release_build_args
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.build_meta.outputs.commit_sha }}
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ steps.build_meta.outputs.commit_sha }}
          cache-from: type=gha
      - name: Trigger watchtower
        if: steps.release_gate.outputs.publish == 'true'
        uses: Mayurifag/multiple-watchtowers-update-action@6a98d6c7f807abecc82a358bb69978157077fee4 # 1.0.1
        with:
          watchtower-urls: ${{ secrets.WATCHTOWER_URLS }}
          watchtower-tokens: ${{ secrets.WATCHTOWER_TOKENS }}
      - name: Save release build cache
        if: steps.release_gate.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/production/production.Dockerfile
          platforms: linux/amd64
          build-args: *release_build_args
          outputs: type=cacheonly
          # Cache uploads must not delay Watchtower or turn a rollout into a failure.
          cache-to: type=gha,mode=max,ignore-error=true,timeout=2m
