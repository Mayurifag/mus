---
name: Linters pipeline

"on":
  push:
    branches: [main]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: true

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress './**/*.md'

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: '**/*.md'

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust from the repository toolchain
        working-directory: backend
        run: rustup toolchain install --no-self-update --no-update
      - name: Install prebuilt FFmpeg
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
      - name: Read audit tool version
        id: audit-tool
        working-directory: backend
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[0].metadata["cargo-audit"]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install prebuilt audit tool
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-audit@${{ steps.audit-tool.outputs.version }}
          fallback: none
      - name: Cache Cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-native-${{ hashFiles('backend/rust-toolchain.toml') }}-${{ hashFiles('backend/Cargo.toml', 'backend/Cargo.lock') }}-${{ hashFiles('backend/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-native-${{ hashFiles('backend/rust-toolchain.toml') }}-${{ hashFiles('backend/Cargo.toml', 'backend/Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-native-${{ hashFiles('backend/rust-toolchain.toml', 'backend/Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-native-${{ hashFiles('backend/rust-toolchain.toml') }}-
      - name: Run backend CI
        run: make BACKEND_RUN="cd backend &&" back-ci

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run frontend CI
        run: make FRONTEND_RUN="cd frontend &&" front-ci-install front-lint front-audit front-test front-svelte-check

  e2e-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/package.json
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Run E2E linting
        run: make e2e-lint e2e-audit
