---
name: Linters pipeline

"on":
  push:
    branches: [main]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_COMPOSE: docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml -f docker/docker-compose.ci.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress './**/*.md'
          lycheeVersion: latest

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust from the repository toolchain
        working-directory: backend
        run: rustup show active-toolchain
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install prebuilt audit tool
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit
          fallback: none
      - name: Cache Cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-native-${{ hashFiles('backend/rust-toolchain.toml', 'backend/Cargo.lock') }}-${{ hashFiles('backend/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-native-${{ hashFiles('backend/rust-toolchain.toml', 'backend/Cargo.lock') }}-
      - name: Run backend CI
        run: make BACKEND_RUN="cd backend &&" back-ci

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/frontend.Dockerfile
          load: true
          tags: mus-frontend-ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Cache frontend npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/frontend/npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-
      - name: Copy Docker Compose override file
        run: cp docker/docker-compose.override.yml.example docker/docker-compose.override.yml
      - name: Install frontend dependencies
        run: |
          make \
            COMPOSE="$CI_COMPOSE" \
            front-ci-install
      - name: Run frontend linting
        run: |
          make \
            COMPOSE="$CI_COMPOSE" \
            front-lint
      - name: Audit frontend dependencies
        run: |
          make \
            COMPOSE="$CI_COMPOSE" \
            front-audit
      - name: Run frontend tests
        run: |
          make \
            COMPOSE="$CI_COMPOSE" \
            front-test
      - name: Run Svelte type checking
        run: |
          make \
            COMPOSE="$CI_COMPOSE" \
            front-svelte-check

  e2e-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Set up npm
        run: npm install -g npm@12.2.3 --no-fund
      - name: Cache E2E npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-e2e-npm-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-npm-
      - name: Run E2E linting
        run: make e2e-lint e2e-audit
