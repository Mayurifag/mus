[package]
name = "mus-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["multipart"] }
blake3 = "1.8.7"
futures-util = "0.3.34"
filetime = "0.2.29"
id3 = "1.17.3"
mime_guess = "2.0.5"
notify = "8.2.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
# Replace this pin when a release supports rusqlite 0.41.
rusqlite_migration = { git = "https://github.com/DannyStoll1/rusqlite_migration.git", rev = "30b941a0850df790091dc58c3ec44f18dbb5e3ba" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "query",
  "rustls",
] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
  "compression-gzip",
  "cors",
  "fs",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"

[dev-dependencies]
flate2 = "1.1.11"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
