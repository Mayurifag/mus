[package]
name = "mus-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[package.metadata]
cargo-audit = "0.23.0"

[dependencies]
anyhow = "1.0.105"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
blake3 = "1.8.7"
futures-util = "0.3.34"
id3 = "1.17.4"
image-webp = "0.2.4"
notify = "9.0.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rusqlite_migration = "2.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "query",
  "rustls",
] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
  "compression-gzip",
  "cors",
  "fs",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
tempfile = "3.27.0"
thumbhash = "0.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
renamore = "0.3.2"

[dev-dependencies]
flate2 = "1.1.11"
tokio = { version = "1.54.1", features = ["test-util"] }

[profile.release]
# Skip local ThinLTO to reduce LLVM work on source-only release builds.
lto = "off"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
